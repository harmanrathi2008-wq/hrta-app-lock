name: Build HRTA App Lock APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Bundle
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Setup Permanent Signing Keystore
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.HRTA_RELEASE_KEYSTORE_BASE64 }}" ]; then
            echo "Restoring permanent signing certificate from repository secret..."
            echo "${{ secrets.HRTA_RELEASE_KEYSTORE_BASE64 }}" | base64 -d > android/app/hrta-release.keystore
          else
            echo "Creating stable release signing keystore..."
            keytool -genkeypair -v \
              -keystore android/app/hrta-release.keystore \
              -alias hrtakey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass hrtasecure2026 \
              -keypass hrtasecure2026 \
              -dname "CN=Harman Rathi, OU=HRTA SECURE SYSTEM, O=HRTA, L=New Delhi, C=IN"
          fi

      - name: Build Signed Release APK
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          RELEASE_VERSION: "1.0.0"
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
          mkdir -p ../build-output
          # Use signed APK from Gradle build
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk ../build-output/hrta-app-lock.apk
          else
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore app/hrta-release.keystore -storepass hrtasecure2026 -keypass hrtasecure2026 app/build/outputs/apk/release/app-release-unsigned.apk hrtakey
            cp app/build/outputs/apk/release/app-release-unsigned.apk ../build-output/hrta-app-lock.apk
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hrta-app-lock-apk
          path: build-output/hrta-app-lock.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: build-output/hrta-app-lock.apk
          name: "HRTA App Lock Official Release v1.0.0"
          body: |
            ## HRTA SECURE SYSTEM
            ### DEVELOPED BY HARMAN RATHI

            Official signed Android App Lock release (`hrta-app-lock.apk`).
            - Signed with permanent release certificate (Android V1 + V2 compliant)
            - 100% Local-First & Offline Privacy
            - Cryptographic Hardware PIN Protection
            - Instant Background Monitoring & 403 Forbidden Shield
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sync Signed APK to Website Downloads Directory
        if: github.ref == 'refs/heads/main'
        run: |
          mkdir -p public/downloads
          cp build-output/hrta-app-lock.apk public/downloads/hrta-app-lock.apk
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/downloads/hrta-app-lock.apk
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(release): sync signed APK to public/downloads for direct hosting [skip ci]" && git push origin HEAD:main)

