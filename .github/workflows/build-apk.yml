name: Build HRTA App Lock APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Bundle
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build and Sign Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon
          # Generate signing keystore
          keytool -genkey -v -keystore hrta_release.keystore -alias hrta -keyalg RSA -keysize 2048 -validity 10000 -storepass hrtasecure2026 -keypass hrtasecure2026 -dname "CN=Harman Rathi, OU=HRTA Security, O=HRTA, L=New Delhi, C=IN"
          # Sign the unsigned APK using jarsigner (standard JDK tool)
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 -keystore hrta_release.keystore -storepass hrtasecure2026 -keypass hrtasecure2026 app/build/outputs/apk/release/app-release-unsigned.apk hrta
          mkdir -p ../build-output
          cp app/build/outputs/apk/release/app-release-unsigned.apk ../build-output/hrta-app-lock.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hrta-app-lock-apk
          path: build-output/hrta-app-lock.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: build-output/hrta-app-lock.apk
          name: "HRTA App Lock Official Release v1.0.0"
          body: |
            ## HRTA SECURE SYSTEM
            ### DEVELOPED BY HARMAN RATHI

            Official signed Android App Lock release (`hrta-app-lock.apk`).
            - Signed and installable on Android 8.0+
            - 100% Local-First & Offline Privacy
            - Cryptographic Hardware PIN Protection
            - Instant Background Monitoring & 403 Forbidden Shield
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
