name: Build HRTA App Lock APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Build Web Bundle
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon

      - name: Rename and Prepare APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk build-output/hrta-app-lock.apk 2>/dev/null || cp android/app/build/outputs/apk/debug/app-debug.apk build-output/hrta-app-lock.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hrta-app-lock-apk
          path: build-output/hrta-app-lock.apk

      - name: Create GitHub Release (On Tag or Dispatch)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: build-output/hrta-app-lock.apk
          name: HRTA App Lock Official Release
          body: |
            ## HRTA SECURE SYSTEM
            ### DEVELOPED BY HARMAN RATHI

            Official Android App Lock release (`hrta-app-lock.apk`).
            - 100% Local-First & Zero Cloud Dependencies
            - Cryptographically Secured
            - Instant App Protection Overlay
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
