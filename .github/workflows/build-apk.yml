name: Build HRTA App Lock APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Verify Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm ci

      - name: Security & Dependency Audit
        run: npm audit --audit-level=high || true

      - name: Run Vitest Unit Tests
        run: npm test

      - name: Build Web Bundle
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Run Android Unit Tests
        run: |
          cd android
          ./gradlew testReleaseUnitTest --no-daemon

      - name: Setup Permanent Signing Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.HRTA_RELEASE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.HRTA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.HRTA_KEY_PASSWORD }}
          KEYSTORE_PASSWORD: ${{ secrets.HRTA_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p android/app
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Restoring permanent signing certificate from repository secret..."
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/hrta-release.keystore
          else
            echo "HRTA_RELEASE_KEYSTORE_BASE64 secret not found in repository settings."
            echo "Generating stable release signing keystore..."
            keytool -genkeypair -v \
              -keystore android/app/hrta-release.keystore \
              -alias "${KEY_ALIAS:-hrtakey}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass "${KEYSTORE_PASSWORD:-hrtasecure2026}" \
              -keypass "${KEY_PASSWORD:-hrtasecure2026}" \
              -dname "CN=Harman Rathi, OU=HRTA SECURE SYSTEM, O=HRTA, L=New Delhi, C=IN"
          fi

      - name: Build Signed Release APK
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '1.0.0' }}
          HRTA_KEYSTORE_PASSWORD: ${{ secrets.HRTA_KEYSTORE_PASSWORD }}
          HRTA_KEY_ALIAS: ${{ secrets.HRTA_KEY_ALIAS }}
          HRTA_KEY_PASSWORD: ${{ secrets.HRTA_KEY_PASSWORD }}
        run: |
          cd android
          export HRTA_KEYSTORE_PASSWORD="${HRTA_KEYSTORE_PASSWORD:-hrtasecure2026}"
          export HRTA_KEY_ALIAS="${HRTA_KEY_ALIAS:-hrtakey}"
          export HRTA_KEY_PASSWORD="${HRTA_KEY_PASSWORD:-hrtasecure2026}"
          ./gradlew assembleRelease --stacktrace --no-daemon
          mkdir -p ../build-output
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk ../build-output/hrta-app-lock.apk
          elif [ -f app/build/outputs/apk/release/app-release-unsigned.apk ]; then
            jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
              -keystore app/hrta-release.keystore \
              -storepass "$HRTA_KEYSTORE_PASSWORD" \
              -keypass "$HRTA_KEY_PASSWORD" \
              app/build/outputs/apk/release/app-release-unsigned.apk "$HRTA_KEY_ALIAS"
            cp app/build/outputs/apk/release/app-release-unsigned.apk ../build-output/hrta-app-lock.apk
          else
            echo "::error::Gradle failed to produce a release APK! Build halted."
            exit 1
          fi

      - name: Verify APK Signatures (V1 / V2 / V3) & Compute SHA-256
        run: |
          APK="build-output/hrta-app-lock.apk"
          echo "=== VERIFYING APK SIGNATURE SCHEME ==="
          $ANDROID_HOME/build-tools/34.0.0/apksigner verify --verbose "$APK"
          echo "=== COMPUTING SHA-256 CHECKSUM ==="
          sha256sum "$APK" | tee build-output/sha256.txt

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: hrta-app-lock-apk
          path: |
            build-output/hrta-app-lock.apk
            build-output/sha256.txt

      - name: Publish or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          files: |
            build-output/hrta-app-lock.apk
            build-output/sha256.txt
          name: "HRTA App Lock Official Release ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}"
          body: |
            ## HRTA SECURE SYSTEM
            ### DEVELOPED BY HARMAN RATHI

            Official production signed Android release (`${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}`).
            - **Signature Integrity**: Verified Android V1, V2, and V3 signing schemes.
            - **Local Recovery**: 100% Offline Android BiometricPrompt & >=80-bit Emergency Recovery Key.
            - **Zero-Cloud Guarantee**: 0 telemetry, 0 tracking, 100% offline privacy.
            - **SHA-256**: See attached `sha256.txt`.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
